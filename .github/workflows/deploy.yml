name: Deploy Otterbot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never cancel an in-progress deploy — wait for it to finish first
concurrency:
  group: deploy-otterbot
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Deny-all default; the deploy job grants itself exactly what it needs below.
permissions: {}

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ── 2. Docker Buildx (enables layer caching) ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # ── 3. Log in to GHCR ────────────────────────────────────────────────────
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Compute image tags ─────────────────────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # ── 5. Build Docker image and push to GHCR ────────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. Deploy slash commands (runs built image on runner, deploys to all guilds)
      # EUPHORIC_API_KEY and DATABASE_URL are required by env.ts validation but not
      # actually used during command registration — placeholder values satisfy Zod.
      # Non-blocking — if Discord secrets aren't set, this step fails but the VPS
      # deploy below still runs because of continue-on-error.
      - name: Deploy slash commands
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          docker run --rm --entrypoint="" \
            -e DISCORD_BOT_TOKEN="${{ secrets.DISCORD_BOT_TOKEN }}" \
            -e DISCORD_CLIENT_ID="${{ secrets.DISCORD_CLIENT_ID }}" \
            -e DATABASE_URL="postgresql://placeholder/placeholder" \
            -e EUPHORIC_API_KEY="placeholder" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            node dist/bot/registerCommands.js

      # ── 7. Deploy to VPS ──────────────────────────────────────────────────────
      - name: Deploy to VPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROJECT_DIR }}

            # Pull latest source (for docker-compose.yml updates)
            git fetch --all
            git reset --hard origin/main

            export BOT_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            # Pull the new image.
            docker compose pull otterbot

            # Bring the container up on the new image. The otterbot service is
            # also watched by watchtower (it auto-updates :latest on GHCR push),
            # so watchtower may already be recreating the container when this
            # step runs. A single `compose up` then races it and dies with
            # "removal of container ... is already in progress". Retry a few
            # times: once watchtower's recreate settles, `up -d` converges to a
            # no-op (container already on the new :latest) and succeeds. Both
            # deployers stay enabled; they just stop fighting.
            for attempt in 1 2 3 4 5; do
              if docker compose up -d --remove-orphans; then
                echo "✓ compose up succeeded (attempt $attempt)"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "ERROR: compose up failed after $attempt attempts"
                docker compose logs otterbot --tail=30 || true
                exit 1
              fi
              echo "compose up attempt $attempt failed (likely a watchtower recreate race) — retrying in 8s…"
              sleep 8
            done

            # Wait for the container to come up AND stay up. A one-shot check
            # 10s after `compose up` raced watchtower here the same way
            # `compose up` itself used to: watchtower can be mid-recreate at
            # check time (old container renamed away, new one still inside the
            # entrypoint's `drizzle-kit push`), so the single `ps` snapshot saw
            # "not running" and failed a deploy that converged fine seconds
            # later (run 30321327502). Poll for up to 2 minutes instead, and
            # require two consecutive positive checks 10s apart so a
            # crash-looping container (briefly "running" between restarts)
            # doesn't slip through.
            healthy=0
            for check in $(seq 1 12); do
              if docker compose ps otterbot | grep -q "running\|Up"; then
                healthy=$((healthy+1))
                if [ "$healthy" -ge 2 ]; then break; fi
              else
                healthy=0
              fi
              sleep 10
            done
            if [ "$healthy" -lt 2 ]; then
              echo "ERROR: otterbot container is not running (waited up to 120s)"
              docker compose ps otterbot || true
              docker compose logs otterbot --tail=50 || true
              exit 1
            fi

            echo "✓ otterbot is running."
            docker compose ps otterbot

      # ── 8. Notify Discord — success ───────────────────────────────────────────
      # Skipped silently if the webhook isn't configured.
      - name: Notify success
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"; exit 0; fi
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          curl -s -o /dev/null -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ Otterbot deployed\",
                \"description\": \"[\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) ${COMMIT_MSG}\",
                \"color\": 5763719,
                \"footer\": { \"text\": \"Triggered by ${GITHUB_ACTOR}\" }
              }]
            }"

      # ── 9. Notify Discord — failure ───────────────────────────────────────────
      - name: Notify failure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_DEPLOY_WEBHOOK not set — skipping notification"; exit 0; fi
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          curl -s -o /dev/null -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ Otterbot deploy FAILED\",
                \"description\": \"[\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) ${COMMIT_MSG}\",
                \"color\": 15548997,
                \"footer\": { \"text\": \"Triggered by ${GITHUB_ACTOR} — check Actions logs\" }
              }]
            }"
